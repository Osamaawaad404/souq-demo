<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Souq demo</title><style>
*{box-sizing:border-box}body{margin:0;background:#eaeded;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#0f1111}
button,select,input,textarea{font:inherit}
header{background:#131921;color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 12px}
.logo{background:none;border:0;color:#fff;font-size:26px;font-weight:800;letter-spacing:-1px;cursor:pointer;min-height:44px}.logo span{color:#f90;font-size:15px}
.search{order:3;flex:1 1 100%;display:flex;border-radius:6px;overflow:hidden;background:#fff;position:relative}
.search select{border:0;background:#e6e6e6;padding:0 6px;max-width:110px}.search input{flex:1;min-width:0;border:0;padding:12px 10px;outline:none;font-size:16px}
.search button{border:0;background:#febd69;padding:0 16px;cursor:pointer}
.hbtn{background:none;border:0;color:#fff;cursor:pointer;min-height:44px;padding:0 6px;font-size:14px;text-align:left}
.hbtn.cart{margin-left:auto}.badge{background:#f90;color:#131921;border-radius:10px;padding:1px 8px;font-weight:800}
.cats{display:flex;overflow-x:auto;background:#232f3e}.cats button{background:none;border:0;color:#fff;padding:12px;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent}.cats .on{border-bottom-color:#f90;font-weight:700}
.note{background:#fff8e1;color:#6b5200;font-size:13px;text-align:center;padding:6px}
main{max-width:1100px;margin:0 auto;padding:14px 12px 50px}
.hero{background:linear-gradient(120deg,#232f3e,#37475a);color:#fff;border-radius:8px;padding:22px 18px;margin-bottom:14px}.hero h1{margin:0 0 6px;font-size:26px}.hero p{margin:0 0 12px;color:#d5dbdb}
.bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin:6px 0 12px;font-size:14px}.bar select{padding:6px;border-radius:6px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{background:#fff;border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:5px}
.card img.pi{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;cursor:pointer;background:#f3f3f3}
.pname{background:none;border:0;padding:0;text-align:left;cursor:pointer;font-size:14px;line-height:1.3;min-height:36px}.pname:hover{color:#c7511f}
.stars{color:#ffa41c;font-size:13px;display:flex;gap:6px;align-items:center}.stars .off{color:#ddd}.stars a{color:#007185}
.price{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}.price b{font-size:20px}.price s{color:#565959;font-size:13px}.price em{color:#cc0c39;font-style:normal;font-size:13px}
.fast{color:#007185;font-size:12px}.ok{color:#007600;font-size:13px}.low{color:#b12704;font-size:13px}
.btn{border:0;border-radius:20px;padding:10px 16px;cursor:pointer;font-weight:600;min-height:44px;background:#ffd814}.btn:hover{background:#f7ca00}.btn.or{background:#ffa41c}.btn.w{width:100%}.btn:disabled{opacity:.5}
.link{background:none;border:0;color:#007185;cursor:pointer;padding:8px 0}.link:hover{text-decoration:underline}
.box{background:#fff;border-radius:8px;padding:16px;margin-bottom:12px}
.detail{display:grid;gap:16px}.detail img{width:100%;border-radius:8px}.detail h2{margin:0 0 6px}
.wrap{display:grid;gap:14px}
.line{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #e7e7e7}.line img{width:76px;height:76px;object-fit:cover;border-radius:6px}.line .info{flex:1;display:flex;flex-direction:column;gap:4px;font-size:14px}
.qty{display:flex;align-items:center;gap:8px}.qty button:not(.link){width:36px;height:36px;border-radius:50%;border:1px solid #aaa;background:#f0f2f2;cursor:pointer;font-size:18px}
.sum div{display:flex;justify-content:space-between;margin:8px 0}.sum .tot{font-size:18px;font-weight:800;border-top:1px solid #ddd;padding-top:10px}
form label{display:block;margin:10px 0 4px;font-size:14px;font-weight:600}form input,form textarea{width:100%;padding:10px;border:1px solid #a6a6a6;border-radius:4px;font-size:16px}
.err{color:#b12704;margin:8px 0;font-size:14px}.pay label{display:flex;gap:8px;align-items:center;font-weight:400;margin:8px 0}.pay input{width:auto}
.review{border-top:1px solid #eee;padding:10px 0;font-size:14px}
.center{text-align:center}.tick{width:80px;height:80px;border-radius:50%;background:#007600;color:#fff;font-size:48px;display:flex;align-items:center;justify-content:center;margin:20px auto}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#131921;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;max-width:90vw}#toast.show{opacity:1}
@media(min-width:700px){.search{order:0;flex:1}.grid{grid-template-columns:repeat(3,1fr)}.detail{grid-template-columns:1fr 1.2fr}.wrap{grid-template-columns:1fr 320px}.hero h1{font-size:36px}.hero{padding:36px 28px}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}

[dir=rtl] .hbtn{text-align:right}[dir=rtl] .cart{margin-left:0;margin-right:auto}[dir=rtl] .stars,[dir=rtl] .price{direction:rtl}.lang{background:none;border:1px solid #888;border-radius:4px;color:#fff;cursor:pointer;min-height:36px;padding:0 10px}

</style></head>

    ['Smart Watch with Heart Rate','Electronics',59,79,25,'watch','Steps, sleep and heart rate. Water resistant. 7 day battery.',1],

    ['Fast Charging Power Bank 20000mAh','Electronics',27.9,39.9,80,'powerbank','Charges a phone about five times. Two USB ports.',0],
    ['Running Sneakers, Lightweight','Fashion',64,85,30,'sneakers','Breathable mesh, cushioned sole, sizes 38 to 46.',1],
    ['Classic Denim Jacket','Fashion',48.25,null,18,'jacket','Regular fit, soft washed denim, four pockets.',0],
    ['Everyday Backpack 25L','Fashion',31.99,44.99,50,'backpack','Laptop sleeve, water bottle pocket, padded straps.',1],
    ['Stainless Steel Water Bottle 1L','Home',17.5,null,120,'bottle','Keeps drinks cold 24 hours or hot 12 hours.',1],
    ['LED Desk Lamp with USB Port','Home',24.99,32,45,'lamp','Three colour modes, five brightness levels, touch control.',1],
    ['Non-Stick Cookware Set, 8 pieces','Home',79,119,15,'cookware','Even heating, easy to clean, works on all stovetops.',1],
    ['Self-Improvement Paperback','Books',12.99,18,200,'book','A popular paperback on building better habits.',1],
    ['Gaming Mouse, 6 Buttons','Gaming',21.99,29.99,70,'mouse','Adjustable DPI up to 7200, RGB lighting, braided cable.',1],
    ['Mechanical Keyboard, Blue Switches','Gaming',45,null,35,'keyboard','Clicky keys, full anti-ghosting, backlit.',1],
    ['Wireless Game Controller','Gaming',33,49,28,'controller','Works with PC and phone. 15 hour battery.',0],
  ];
  const KEY = 'souq-static-db-v1';
  const load = () => { try { const d = JSON.parse(localStorage.getItem(KEY)); if (d) return d; } catch (e) {} return { products: seed.map((s, i) => ({ id: i + 1, name: s[0], cat: s[1], price: s[2], was: s[3], stock: s[4], img: s[5], descr: s[6], fast: s[7] })), users: [], sessions: {}, reviews: [], orders: [] }; };

  const rate = (p) => { const rs = D.reviews.filter((r) => r.product_id === p.id); return { ...p, rating: rs.length ? Math.round(rs.reduce((a, r) => a + r.stars, 0) / rs.length * 10) / 10 : 0, reviews: rs.length }; };

    if (p === '/products' && method === 'GET') {
      const q = (u.searchParams.get('q') || '').toLowerCase().trim(), cat = u.searchParams.get('cat') || 'All', sort = u.searchParams.get('sort') || 'featured';
      const rows = D.products.map(rate).filter((r) => (cat === 'All' || r.cat === cat) && (!q || q.split(/\s+/).every((w) => (r.name + ' ' + r.cat + ' ' + r.descr).toLowerCase().includes(w))));
      if (sort === 'low') rows.sort((a, b) => a.price - b.price);
      if (sort === 'high') rows.sort((a, b) => b.price - a.price);
      if (sort === 'rating') rows.sort((a, b) => b.rating - a.rating);
      return { code: 200, body: rows };
    }
    if ((m = p.match(/^\/products\/(\d+)\/related$/)) && method === 'GET') {
      const id = +m[1], cur = D.products.find((x) => x.id === id); if (!cur) return err(404, 'Not found'); const cnt = {};
      D.orders.forEach((o) => { if (o.items.some((i) => i.product_id === id)) o.items.forEach((i) => { if (i.product_id !== id) cnt[i.product_id] = (cnt[i.product_id] || 0) + 1; }); });
      const together = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a]).map(Number); const same = D.products.filter((x) => x.cat === cur.cat && x.id !== id).map((x) => x.id);
      return { code: 200, body: [...new Set([...together, ...same])].slice(0, 4).map((i) => D.products.find((x) => x.id === i)) };
    }
    if ((m = p.match(/^\/products\/(\d+)$/)) && method === 'GET') {
      const r = D.products.find((x) => x.id === +m[1]); if (!r) return err(404, 'Not found');
      return { code: 200, body: { ...rate(r), reviewList: D.reviews.filter((x) => x.product_id === r.id).reverse().map((x) => ({ stars: x.stars, body: x.body, ts: x.ts, name: (D.users.find((y) => y.id === x.user_id) || {}).name })) } };

      if (!['cod', 'test-card'].includes(b.pay)) return err(400, 'Choose a payment method');
      const items = (b.items || []).map((i) => ({ id: +i.id, qty: Math.max(1, Math.min(10, +i.qty | 0)) }));
      if (!items.length) return err(400, 'Cart is empty');
      let sub = 0; const rows = [];
      for (const it of items) { const r = D.products.find((x) => x.id === it.id); if (!r) return err(400, 'Unknown product'); if (r.stock < it.qty) return err(400, 'Only ' + r.stock + ' left of ' + r.name); rows.push([r, it.qty]); sub += r.price * it.qty; }
      const o = { id: D.orders.length + 1, user_id: me.id, total: +(sub + ship(sub)).toFixed(2), shipping: ship(sub), address: String(b.address).slice(0, 300), pay: b.pay, status: 'Processing', ts: new Date().toISOString(), items: rows.map(([r, q]) => ({ product_id: r.id, name: r.name, price: r.price, qty: q })) };
      rows.forEach(([r, q]) => { r.stock -= q; }); D.orders.push(o); save();
      return { code: 200, body: { orderId: o.id, total: o.total } };
    }
    if (p === '/orders' && method === 'GET') { if (!me) return err(401, 'Sign in'); return { code: 200, body: D.orders.filter((o) => o.user_id === me.id).reverse() }; }
    if (p === '/wishlist' && method === 'GET') { if (!me) return err(401, 'Sign in'); D.wishlist = D.wishlist || []; return { code: 200, body: D.products.filter((x) => D.wishlist.some((w) => w.u === me.id && w.p === x.id)).map(rate) }; }
    if ((m = p.match(/^\/wishlist\/(\d+)$/)) && method === 'POST') { if (!me) return err(401, 'Sign in to use your wishlist'); D.wishlist = D.wishlist || []; const i = D.wishlist.findIndex((w) => w.u === me.id && w.p === +m[1]); if (i >= 0) D.wishlist.splice(i, 1); else D.wishlist.push({ u: me.id, p: +m[1] }); save(); return { code: 200, body: { on: i < 0 } }; }

      if (!name || !(price > 0 && price < 100000) || !(stock >= 0 && stock < 100000) || !['Electronics', 'Fashion', 'Home', 'Books', 'Gaming'].includes(b.cat)) return err(400, 'Name, category, a price above 0 and stock are required');

    }

  };
})();

async function product(id) {
  const p = await api('/products/' + id);
  shell(`<button class="link" data-go="#/">‹ Back to results</button><section class="box detail"><img src="${window.IMGS[p.img]}" alt="${esc(p.name)}"><div><h2>${esc(p.name)}</h2>${stars(p.rating, p.reviews)}${priceHtml(p)}<p>${esc(p.descr)}</p><p class="fast">${p.fast ? '✔ Fast delivery, tomorrow' : 'Delivery in 3 to 5 days'}</p>${stockHtml(p)}<br><button class="btn" data-add="${p.id}" ${p.stock <= 0 ? 'disabled' : ''}>Add to Cart</button> <button class="btn or" data-add="${p.id}" data-buy="1" ${p.stock <= 0 ? 'disabled' : ''}>Buy Now</button> <button class="link" data-wish="${p.id}">${S.wish.has(p.id) ? '♥ In wishlist' : '♡ Add to wishlist'}</button></div></section>
  <section class="box"><h3>Customer reviews</h3>${p.reviewList.map((r) => `<div class="review"><b>${esc(r.name)}</b> <span class="stars">${'★'.repeat(r.stars)}</span><div>${esc(r.body)}</div></div>`).join('') || '<p>No reviews yet. Be the first.</p>'}
  ${S.user ? `<form id="rf"><label>Your rating</label><select id="rs"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select><label>Your review</label><textarea id="rb" rows="3"></textarea><div class="err" id="re"></div><button class="btn" type="submit">Submit review</button></form>` : '<p><button class="link" data-go="#/login">Sign in to write a review</button></p>'}</section>`);
  const rel = await api('/products/' + id + '/related'); if (rel.length) $('main').insertAdjacentHTML('beforeend', `<section class="box"><h3>Customers also viewed</h3><div class="grid">${rel.map((r) => `<article class="card"><img class="pi" src="${window.IMGS[r.img]}" alt="${esc(r.name)}" data-go="#/p/${r.id}"><button class="pname" data-go="#/p/${r.id}">${esc(r.name)}</button>${priceHtml(r)}</article>`).join('')}</div><small>Rule-based: items bought together in past orders on this store, then same category. Not a learned model.</small></section>`);
  if ($('#rf')) $('#rf').onsubmit = async (e) => { e.preventDefault(); try { await api(`/products/${id}/reviews`, { method: 'POST', body: { stars: $('#rs').value, body: $('#rb').value } }); toast('Review posted'); product(id); } catch (x) { $('#re').textContent = x.message; } };
}
async function cart() {
  const items = Object.entries(S.cart).map(([id, qty]) => ({ id, qty }));
  if (!items.length) return shell('<div class="box center"><h2>Your cart is empty</h2><button class="btn" data-go="#/">Keep shopping</button></div>');
  const c = await api('/cart/price', { method: 'POST', body: { items } });
  shell(`<h2>Shopping Cart</h2><div class="wrap"><div class="box">${c.lines.map((p) => `<div class="line"><img src="${window.IMGS[p.img]}" alt=""><div class="info"><b>${esc(p.name)}</b>${stockHtml(p)}<div class="qty"><button data-q="${p.id}" data-d="-1" aria-label="Less">−</button><span>${p.qty}</span><button data-q="${p.id}" data-d="1" aria-label="More">+</button><button class="link" data-del="${p.id}">Delete</button></div></div><b>${money(p.price * p.qty)}</b></div>`).join('')}</div>
  <aside class="box sum"><div><span>Items (${c.lines.reduce((a, l) => a + l.qty, 0)})</span><span>${money(c.subtotal)}</span></div><div><span>Shipping</span><span>${c.shipping ? money(c.shipping) : 'FREE'}</span></div>${c.shipping ? `<small>Add ${money(35 - c.subtotal)} more for free shipping</small>` : ''}<div class="tot"><span>Order total</span><span>${money(c.total)}</span></div><button class="btn w" data-go="#/checkout">Proceed to checkout</button></aside></div>`);
  document.querySelectorAll('[data-q]').forEach((b) => b.onclick = () => { const id = b.dataset.q, n = (S.cart[id] || 0) + +b.dataset.d; if (n <= 0) delete S.cart[id]; else S.cart[id] = Math.min(10, n); saveCart(); cart(); });
  document.querySelectorAll('[data-del]').forEach((b) => b.onclick = () => { delete S.cart[b.dataset.del]; saveCart(); cart(); });
}
async function checkout() {
  if (!S.user) { toast('Sign in first'); location.hash = '#/login'; return; }
  const items = Object.entries(S.cart).map(([id, qty]) => ({ id, qty })); if (!items.length) { location.hash = '#/cart'; return; }
  const c = await api('/cart/price', { method: 'POST', body: { items } });
  shell(`<h2>Checkout</h2><div class="wrap"><form class="box" id="cf"><label>Demo delivery address</label><div class="note" style="border-radius:6px">Type a made-up address. Never your real one.</div><textarea id="ad" rows="3" placeholder="1 Test Street, Demo City"></textarea><button class="link" type="button" id="fa">Fill a demo address</button><label>Payment</label><div class="pay"><label><input type="radio" name="pay" value="cod" checked> Cash on delivery</label><label><input type="radio" name="pay" value="test-card"> Test card (no real charge)</label></div><div class="err" id="ce"></div><button class="btn w" type="submit">Place demo order</button></form>
  <aside class="box sum"><div><span>Items</span><span>${money(c.subtotal)}</span></div><div><span>Shipping</span><span>${c.shipping ? money(c.shipping) : 'FREE'}</span></div><div class="tot"><span>Order total</span><span>${money(c.total)}</span></div></aside></div>`);
  $('#fa').onclick = () => { $('#ad').value = '1 Test Street, Demo City'; };
  $('#cf').onsubmit = async (e) => { e.preventDefault(); try { const o = await api('/orders', { method: 'POST', body: { items, address: $('#ad').value, pay: document.querySelector('input[name=pay]:checked').value } }); S.cart = {}; saveCart(); done(o); } catch (x) { $('#ce').textContent = x.message; } };
}
function done(o) { shell(`<div class="box center"><div class="tick">✓</div><h2>Demo order #${o.orderId} placed</h2><p>Total ${money(o.total)}. Nothing is charged or shipped.</p><button class="btn" data-go="#/orders">View my orders</button></div>`); }
async function orders() {
  if (!S.user) { location.hash = '#/login'; return; }
  const os = await api('/orders');
  shell(`<h2>Your orders</h2>${os.map((o) => `<div class="box"><b>Order #${o.id}</b> · ${new Date(o.ts).toLocaleString()} · ${esc(o.status)} · ${money(o.total)} · ${o.pay === 'cod' ? 'Cash on delivery' : 'Test card'}${o.items.map((i) => `<div class="review">${i.qty} × ${esc(i.name)} · ${money(i.price)}</div>`).join('')}<div class="review">Deliver to: ${esc(o.address)}</div></div>`).join('') || '<div class="box center">No orders yet.</div>'}`);
}
async function wishlist() {
  if (!S.user) { location.hash = '#/login'; return; }
  const rows = await api('/wishlist');
  shell(`<h2>Your wishlist</h2>${rows.length ? '' : '<div class="box center">Nothing saved yet. Tap the heart link on any product.</div>'}<div class="grid">${rows.map((p) => `<article class="card"><img class="pi" src="${window.IMGS[p.img]}" alt="${esc(p.name)}" data-go="#/p/${p.id}"><button class="pname" data-go="#/p/${p.id}">${esc(p.name)}</button>${priceHtml(p)}${stockHtml(p)}<button class="btn" data-add="${p.id}" ${p.stock <= 0 ? 'disabled' : ''}>Add to Cart</button><button class="link" data-wish="${p.id}">Remove</button></article>`).join('')}</div>`);
}
async function seller() {
  if (!S.user) { location.hash = '#/login'; return; }
  const mine = await api('/seller/products');
  shell(`<h2>Seller hub</h2><div class="note" style="border-radius:6px;margin-bottom:12px">Test data only. Listings appear in the store for everyone using this ${STATIC ? 'browser' : 'server'}.</div>
  <form class="box" id="sf2"><h3>Add a product</h3><label>Product name</label><input id="sn" placeholder="Demo product"><label>Category</label><select id="scat" style="width:100%;padding:10px">${CATS.slice(1).map((c) => `<option>${c}</option>`).join('')}</select><label>Price (USD)</label><input id="spr" type="number" step="0.01" min="0.01"><label>Stock</label><input id="sst" type="number" min="0" value="10"><label>Description</label><textarea id="sde" rows="2"></textarea><div class="err" id="se"></div><button class="btn" type="submit">List product</button></form>
  <section class="box"><h3>Your listings (${mine.length})</h3>${mine.map((p) => `<div class="line"><img src="${window.IMGS[p.img]}" alt=""><div class="info"><b>${esc(p.name)}</b><span>${money(p.price)} · ${p.stock} in stock</span><div class="qty"><button data-stk="${p.id}" data-d="-1" aria-label="Less stock">−</button><span>${p.stock}</span><button data-stk="${p.id}" data-d="1" aria-label="More stock">+</button></div></div></div>`).join('') || '<p>No listings yet.</p>'}</section>`);
  $('#sf2').onsubmit = async (e) => { e.preventDefault(); try { await api('/seller/products', { method: 'POST', body: { name: $('#sn').value, cat: $('#scat').value, price: $('#spr').value, stock: $('#sst').value, descr: $('#sde').value } }); toast('Product listed'); seller(); } catch (x) { $('#se').textContent = x.message; } };
  document.querySelectorAll('[data-stk]').forEach((b) => b.onclick = async () => { const p = mine.find((x) => x.id === +b.dataset.stk); try { await api('/seller/products/' + p.id, { method: 'PATCH', body: { stock: Math.max(0, p.stock + +b.dataset.d) } }); seller(); } catch (x) { toast(x.message); } });
}
function login(reg) {
  shell(`<form class="box" id="lf" style="max-width:380px;margin:auto"><h2>${reg ? 'Create account' : 'Sign in'}</h2><div class="note" style="border-radius:6px">Test data only. Use made-up details, never your real password or email.</div><button class="btn w" type="button" id="demo" style="margin-top:10px">Use a demo shopper</button>${reg ? '<label>Demo name</label><input id="ln" placeholder="Demo Shopper">' : ''}<label>Demo email</label><input id="le" type="email" placeholder="shopper@example.test"><label>Demo password</label><input id="lp" type="password" placeholder="Make one up, not a real one"><div class="err" id="lr"></div><button class="btn w" type="submit">${reg ? 'Create account' : 'Sign in'}</button><p><button class="link" type="button" id="sw">${reg ? 'Already have an account? Sign in' : 'New here? Create an account'}</button></p></form>`);
  $('#sw').onclick = () => login(!reg);
  $('#demo').onclick = async () => { const n = Math.random().toString(36).slice(2, 8); try { const r = await api('/register', { method: 'POST', body: { name: 'Demo Shopper', email: `demo-${n}@example.test`, password: 'demo-' + n + '-pass' } }); S.token = r.token; S.user = r.user; localStorage.setItem('token', r.token); toast('Signed in as a demo shopper'); location.hash = Object.keys(S.cart).length ? '#/cart' : '#/'; } catch (x) { $('#lr').textContent = x.message; } };
  $('#lf').onsubmit = async (e) => { e.preventDefault(); try { const r = await api(reg ? '/register' : '/login', { method: 'POST', body: { name: reg ? $('#ln').value : undefined, email: $('#le').value, password: $('#lp').value } }); S.token = r.token; S.user = r.user; localStorage.setItem('token', r.token); toast('Welcome ' + r.user.name); location.hash = Object.keys(S.cart).length ? '#/cart' : '#/'; } catch (x) { $('#lr').textContent = x.message; } };
}
var route = async function route() {
  const h = location.hash || '#/';
  try {
    if (S.token && !S.user) { try { S.user = await api('/me'); } catch { S.token = null; localStorage.removeItem('token'); } }
    if (S.user) { try { S.wish = new Set((await api('/wishlist')).map((x) => x.id)); } catch (e) { /* ignore */ } } else S.wish = new Set();
    let m;
    if ((m = h.match(/^#\/p\/(\d+)/))) await product(m[1]);
    else if (h === '#/cart') await cart(); else if (h === '#/checkout') await checkout();
    else if (h === '#/orders') await orders(); else if (h === '#/wishlist') await wishlist(); else if (h === '#/seller') await seller(); else if (h === '#/login') login(false);
    else await home();
    window.scrollTo(0, 0);
  } catch (e) { $('#app').innerHTML = '<main><div class="box">Could not load: ' + esc(e.message) + '</div></main>'; }
}
const routeRaw = route;
route = async function () { await routeRaw(); window.i18n.apply(); };
window.addEventListener('hashchange', () => route()); route();

</script>
</body></html>
